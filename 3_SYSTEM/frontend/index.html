<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div id="railHead"></div>
            <nav id="nav"></nav>
            <div class="sidebar-foot">
                <img class="aunea-brand-logo" src="./assets/brand/Logo.png" alt="AUNEA System">
                <div class="sidebar-signature"><p>AUNEA SYSTEM</p><small>SISTEMAS QUE<br>OPTIMIZAN TU NEGOCIO.</small></div>
            </div>
        </aside>
        <main class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <button id="mobileMenu" class="icon-btn mobile-only" aria-label="Abrir menú">☰</button>
                    <div class="topbar-location">
                        <div id="breadcrumb" class="breadcrumb">Cockpit de consultoría</div>
                        <div id="topbarContext"></div>
                    </div>
                </div>
                <div class="topbar-center" aria-label="Búsqueda global">
                    <span class="topbar-search-icon" aria-hidden="true">⌕</span>
                    <input id="globalSearch" type="search" placeholder="Buscar en AUNEA" autocomplete="off" aria-label="Buscar en AUNEA">
                </div>
                <div class="topbar-right">
                    <div id="stepProgress"></div>
                    <div id="backendBadge" class="backend-badge offline"><span></span> Backend sin comprobar</div>
                    <div id="saveState" class="save-state">Sin cambios</div>
                    <button id="saveBtn" class="btn btn-outline">Guardar</button>
                    <div class="user-chip" aria-label="Usuario AUNEA">
                        <div class="avatar">PC</div>
                        <div><b>Pedro Carrasco</b><small>Consultor</small></div>
                    </div>
                </div>
            </header>
            <section id="content" class="content">
                <div class="loading-card">Cargando AUNEA Internal…</div>
            </section>
        </main>
    </div>
    <div id="toast" class="toast"></div>
