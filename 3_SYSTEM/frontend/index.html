<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0F3B2E">
    <title>AUNEA Internal v2.0.0 REVIEW</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #railHead .brand {
            height: 74px;
            padding: 0 14px;
            background: #0F3B2E;
            border-bottom: 1px solid rgba(255, 255, 255, .14);
            display: flex;
            align-items: center;
            justify-content: center
        }

        #railHead .brand>* {
            display: none !important
        }

        #railHead .brand>.aunea-brand-logo {
            display: block !important;
            width: 190px;
            height: 64px;
            object-fit: contain
        }

        .sidebar-foot {
            min-height: 72px;
            padding: 12px 14px;
            background: #0F3B2E;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .sidebar-foot>* {
            display: none !important
        }

        .sidebar-foot>.aunea-brand-logo {
            display: block !important;
            width: 185px;
            height: 60px;
            object-fit: contain
        }

        .rail-context-actions .btn {
            min-height: 34px
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div id="railHead"></div>
            <nav id="nav"></nav>
            <div class="sidebar-foot"><img class="aunea-brand-logo" src="./assets/brand/Logo.png"
                    alt="AUNEA System"></div>
        </aside>
        <main class="main">
            <header class="topbar">
                <div class="topbar-left"><button id="mobileMenu" class="icon-btn mobile-only">☰</button>
                    <div id="breadcrumb" class="breadcrumb">Cockpit de consultoría</div>
                    <div id="topbarContext"></div>
                </div>
                <div class="topbar-right">
                    <div id="stepProgress"></div>
                    <div id="backendBadge" class="backend-badge offline"><span></span> Backend sin comprobar</div>
                    <div id="saveState" class="save-state">Sin cambios</div><button id="saveBtn"
                        class="btn btn-outline">Guardar</button>
                    <div class="user-chip">
                        <div class="avatar">AC</div>
                        <div><b>AUNEA</b><small>Consultor</small></div>
                    </div>
                </div>
            </header>
            <section id="content" class="content">
                <div class="loading-card">Cargando AUNEA Internal…</div>
            </section>
        </main>
    </div>
    <div id="toast" class="toast"></div>
    <div id="modalRoot"></div>
    <script src="core/state.js" defer></script>
    <script src="core/i18n.js" defer></script>
    <script src="services/backend-client.js" defer></script>

    <script src="ui/renderer.js" defer></script>
    <script src="domain/no-reask.js" defer></script>
    <script src="domain/company.js" defer></script>
    <script src="domain/contact.js" defer></script>
    <script src="domain/interaction.js" defer></script>
    <script src="domain/opportunity.js" defer></script>
    <script src="domain/engagement.js" defer></script>
    <script src="domain/session-snapshot.js" defer></script>
    <script src="domain/risk.js" defer></script>
    <script src="domain/economics.js" defer></script>
    <script src="domain/process-lifecycle.js" defer></script>
    <script src="pages/results.js" defer></script>
    <script src="domain/output-review.js" defer></script>
    <script src="pages/crm-companies.js" defer></script>
    <script src="pages/crm-contacts.js" defer></script>
    <script src="pages/crm-interactions.js" defer></script>
    <script src="pages/crm-opportunities.js" defer></script>
    <script src="pages/session-display.js" defer></script>
    <script src="domain/process.js" defer></script>
    <script src="ui/process-help.js" defer></script>
    <script src="services/engine-adapter.js" defer></script>
    <script src="domain/completion.js" defer></script>
    <script src="domain/project.js" defer></script>
    <script src="pages/projects.js" defer></script>
    <script src="ui/shell.js" defer></script>
    <script src="services/persistence.js" defer></script>
    <script src="uat/visible.js" defer></script>
    <script src="uat/fixtures.js" defer></script>
    <script src="boot.js" defer></script>
    <script>function ensureAuneaRailLogo() { const brand = document.querySelector('#railHead .brand'); if (brand && !brand.querySelector('.aunea-brand-logo')) brand.insertAdjacentHTML('beforeend', '<img class="aunea-brand-logo" src="./assets/brand/aunea-system-dark.jpg" alt="AUNEA System">') } const rail = document.getElementById('railHead'); if (rail) new MutationObserver(ensureAuneaRailLogo).observe(rail, { childList: true, subtree: true }); document.addEventListener('DOMContentLoaded', ensureAuneaRailLogo); document.addEventListener('click', function (ev) { const open = ev.target.closest('[data-open-context]'), change = ev.target.closest('[data-change-context]'), clear = ev.target.closest('[data-clear-context]'); if (!open && !change && !clear) return; ev.preventDefault(); ev.stopImmediatePropagation(); if (open) { const e = state.engagements.find(x => x.id === open.dataset.openContext) || currentEng(); if (!e) return; state.activeEngagementId = e.id; state.activePage = 'diagnostico'; render(); return } if (change) { state.activeEngagementId = null; state.activePage = 'estudios'; render(); return } if (clear) { state.activeEngagementId = null; state.activePage = 'inicio'; render() } }, true);</script>
</body>

</html>
