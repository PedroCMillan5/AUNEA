# [AUNEA-BUILD-BACKEND-PYPROJECT-010] START — Backend package/build config
# PURPOSE: Define package metadata, runtime/test dependencies and pytest discovery for aunea_backend.
# CHANGE_RISK: LOW.
[project]
name = "aunea-backend"
version = "1.1.1"
description = "Deterministic backend for AUNEA Internal diagnostic, recommendation, pricing, scenario, deliverables, specification and system builder engines"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn>=0.30"
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["aunea_backend"]
# [AUNEA-BUILD-BACKEND-PYPROJECT-010] END
