<style>
/* [AUNEA-FE-SIM-STYLE-010] START — Simulator interface review styling
   PURPOSE: Materialize AUNEA_SYSTEM_SIMULATOR_CANONICAL v1.3 with the System visual skin.

:root{
  --system:#0F3B2E;--sage:#6FA885;--system-soft:#EAF2ED;--gold:#D4AF37;

}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--warm);color:var(--ink);font:16px/1.5 var(--body)}

.app{min-height:100vh;display:grid;grid-template-columns:minmax(208px,2fr) minmax(0,10fr)}

.nav-group{margin-top:22px}.nav-label{margin:0 8px 8px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#a9c8ba}.nav-btn{width:100%;border:0;background:transparent;color:#dce8e2;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;text-align:left;padding:9px 10px;border-radius:8px;margin:2px 0}.nav-btn:hover{background:rgba(255,255,255,.08)}.nav-btn.active{background:#fff;color:var(--system);font-weight:600}.nav-num{font:700 11px var(--display);opacity:.72}.nav-state{width:7px;height:7px;border-radius:50%;border:1px solid currentColor;opacity:.55}.nav-btn.done .nav-state{background:var(--gold);border-color:var(--gold);opacity:1}.internal-tools{margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.16)}
.main{min-width:0}.topbar{position:sticky;top:0;z-index:20;min-height:72px;background:rgba(250,250,248,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 28px}.context{min-width:0}.context strong{display:block;font:600 14px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.context span{font-size:12px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:10px}.save-state{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}.save-state:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--success)}
.mode{display:inline-flex;background:var(--beige);border:1px solid var(--line);padding:3px;border-radius:10px}.mode button{border:0;background:transparent;padding:8px 12px;border-radius:7px;color:var(--muted);font-weight:600}.mode button.active{background:#fff;color:var(--system);box-shadow:0 1px 4px rgba(0,0,0,.07)}
.workspace{max-width:1280px;margin:0 auto;padding:32px 32px 96px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:28px}.eyebrow{font:700 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--system);margin-bottom:8px}.page-head h1{font:700 36px/1.2 var(--display);letter-spacing:-.025em;margin:0}.page-head p{max-width:760px;color:var(--muted);margin:8px 0 0}.head-meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;color:var(--muted)}.chip.system{border-color:#b8d2c5;background:var(--system-soft);color:var(--system)}.chip.warn{border-color:#e5c693;background:#fff8eb;color:#7b4c00}.chip.internal{border-style:dashed}
.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.aside{grid-template-columns:minmax(0,1.65fr) minmax(290px,.75fr)}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:22px}.card.soft{background:var(--system-soft);border-color:#d9e8e0}.card.beige{background:var(--beige)}.card h2,.card h3{font-family:var(--display);margin:0}.card h2{font-size:22px}.card h3{font-size:16px}.card p{color:var(--muted);margin:7px 0 0}.section-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.section-title strong{font:600 16px var(--display)}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:6px}.field small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.control{width:100%;min-height:44px;border:1px solid #cfd3cf;border-radius:var(--r-control);background:#fff;padding:10px 12px;color:var(--ink)}.control.derived{background:#f7f8f6;color:#545954}.control::placeholder{color:#9a9e99}.status-line{margin-top:14px;padding:11px 13px;border-radius:8px;background:#f7f8f6;color:var(--muted);font-size:13px;border-left:3px solid var(--sage)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px}.kpi span{font-size:12px;color:var(--muted)}.kpi b{display:block;font:700 24px var(--display);margin-top:5px}.kpi em{font-style:normal;font-size:11px;color:var(--muted)}
.scope-flow{display:grid;grid-template-columns:minmax(150px,1fr) 54px minmax(220px,1.35fr) 54px minmax(150px,1fr);align-items:stretch;gap:8px}.scope-node{border:1px solid var(--line);border-radius:12px;padding:20px;background:#fff}.scope-node.main{border:2px solid var(--system);background:var(--system-soft)}.arrow{display:flex;align-items:center;justify-content:center;color:var(--system);font:700 24px var(--display)}

.inspector{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}.inspector h3{font:700 16px var(--display);margin:0 0 4px}.inspector .meta{font-size:11px;color:var(--muted);margin-bottom:16px}.detail-list{display:grid;gap:10px}.detail{padding-bottom:9px;border-bottom:1px solid var(--line)}.detail:last-child{border:0}.detail span{display:block;font-size:11px;color:var(--muted)}.detail b{display:block;font-size:13px;margin-top:2px}.internal-metadata{margin-top:15px;padding:12px;border:1px dashed #b9bdb9;border-radius:8px;font-size:11px;color:var(--muted);background:#fbfbfa}
.friction-list,.risk-list{display:grid;gap:10px}.finding{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff}.finding .badge{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff8eb;color:var(--warning);font:700 11px var(--display);border:1px solid #e5c693}.finding strong{font:600 13px var(--display)}.finding p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.evidence{font-size:11px;border-radius:999px;padding:4px 7px;background:#f4f6f4;color:#526057;white-space:nowrap}.evidence.pending{background:#fff8eb;color:#7b4c00}.risk-tag{font-size:11px;padding:4px 7px;border-radius:999px;background:#fff3f1;color:var(--error);white-space:nowrap}
.guardrail{padding:14px;border-left:3px solid var(--gold);background:#fffdf6;border-radius:0 8px 8px 0;font-size:13px}.guardrail strong{font-family:var(--display)}
.triad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.triad .card{min-height:180px}.triad .card:first-child{border-top:3px solid var(--system)}.triad .card:nth-child(2){border-top:3px solid var(--sage)}.triad .card:nth-child(3){border-top:3px solid var(--gold)}
.review-panel{display:grid;gap:12px}.check-row{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}.check-row:last-child{border:0}.dot{width:12px;height:12px;border-radius:50%;background:var(--success);margin-top:4px}.dot.warn{background:var(--warning)}
.compare-switch{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:#fff;padding:3px}.compare-switch button{border:0;background:transparent;padding:8px 12px;border-radius:6px;font-weight:600;color:var(--muted)}.compare-switch button.active{background:var(--system);color:#fff}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.compare-grid .canvas{min-height:220px}.delta-table{width:100%;border-collapse:collapse}.delta-table th,.delta-table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.delta-table th{font:600 12px var(--display);color:var(--system);background:#fafbf9}.not-supported{color:var(--muted);font-style:italic}
.solution-hero{background:var(--system);color:#fff;border-radius:12px;padding:28px}.solution-hero .eyebrow{color:#d7b94b}.solution-hero h2{font:700 28px/1.2 var(--display);margin:5px 0 8px}.solution-hero p{color:#dce8e2;max-width:800px}.scenario-grid{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:14px;overflow:auto;padding-bottom:4px}.scenario{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.scenario.optimal{border:2px solid var(--system)}.scenario-head{padding:18px;border-bottom:1px solid var(--line)}.scenario.optimal .scenario-head{background:var(--system-soft)}.scenario-body{padding:8px 18px 18px}.scenario-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.scenario-row span:first-child{color:var(--muted)}
.story{display:grid;gap:12px}.story-item{display:grid;grid-template-columns:42px 1fr;gap:14px}.story-index{width:38px;height:38px;border-radius:50%;background:var(--system-soft);color:var(--system);display:grid;place-items:center;font:700 12px var(--display)}.story-content{padding:2px 0 18px;border-bottom:1px solid var(--line)}.story-content strong{font:600 15px var(--display)}.story-content p{margin:4px 0 0;color:var(--muted);font-size:13px}
.actionbar{position:fixed;z-index:18;bottom:0;left:max(208px,16.66vw);right:0;background:rgba(250,250,248,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}.actionbar .left,.actionbar .right{display:flex;gap:8px;align-items:center}.progress-text{font-size:12px;color:var(--muted)}
.session .app{grid-template-columns:1fr}.session .rail{display:none}.session .actionbar{left:0}.session .internal-only{display:none!important}.session .workspace{max-width:1280px}.session .topbar{padding-left:max(24px,calc((100vw - 1280px)/2 + 32px));padding-right:max(24px,calc((100vw - 1280px)/2 + 32px))}.session .page-head h1{font-size:40px}.session .context span{display:none}.session .internal-metadata{display:none}
.mobile-nav{display:none}
@media(max-width:1050px){.app{grid-template-columns:72px minmax(0,1fr)}.rail{padding:20px 10px}.brand strong,.brand span,.nav-label,.nav-btn span:nth-child(2),.internal-tools .tool-text{display:none}.brand{justify-content:center}.nav-btn{grid-template-columns:1fr;place-items:center}.nav-state{display:none}.actionbar{left:72px}.workspace{padding:28px 24px 96px}.grid.aside{grid-template-columns:1fr}.inspector{position:relative}.kpis{grid-template-columns:repeat(2,1fr)}.scope-flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg);min-height:28px}.triad{grid-template-columns:1fr}.scenario-grid{grid-template-columns:repeat(3,minmax(280px,1fr))}}
@media(max-width:720px){.app{display:block}.rail{display:none}.actionbar{left:0;padding:10px 16px}.workspace{padding:22px 20px 100px}.topbar{padding:10px 16px}.context span,.save-state{display:none}.page-head{display:block}.page-head h1,.session .page-head h1{font-size:28px}.head-meta{justify-content:flex-start;margin-top:12px}.grid.two,.grid.three,.field-grid,.compare-grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}.flow-row{min-width:650px}.mobile-nav{display:block}.actionbar .progress-text{display:none}.mode button{padding:7px 9px;font-size:12px}}

<!-- [AUNEA-FE-SIM-SHELL-020] START — Simulator REVIEW application shell -->
<!-- PURPOSE: Render the canonical Internal/Session shell without business logic. -->
<!-- CHANGE_RISK: MEDIUM. -->
<div id="root"></div>
<!-- [AUNEA-FE-SIM-SHELL-020] END -->
<script>
// [AUNEA-FE-SIM-PAGES-030] START — Canonical page presentation model
// PURPOSE: Represent PG01–PG15 layout contract without duplicating business calculations.
// SOURCE: AUNEA_SYSTEM_SIMULATOR_CANONICAL v1.3 sections 23–45.
// INPUTS: local REVIEW navigation only.
// OUTPUTS: DOM reference prototype.
// SIDE_EFFECTS: DOM only; no API, storage or calculations.
// CHANGE_RISK: HIGH.
const PAGES=[
 {id:'PG01',group:'Captura y validación',title:'Contexto y objetivo',sub:'Identificar empresa, interlocutores, objetivo, criterio de éxito y restricciones iniciales.',kind:'context',coverage:'DF001–DF010'},
 {id:'PG02',group:'Captura y validación',title:'Alcance del proceso',sub:'Delimitar el proceso end-to-end desde el evento que lo inicia hasta el resultado correcto.',kind:'scope',coverage:'DF011–DF020'},
 {id:'PG03',group:'Captura y validación',title:'Demanda, volumen y servicio',sub:'Establecer la baseline operativa sin crear falsa precisión.',kind:'baseline',coverage:'DF021–DF030'},
 {id:'PG04',group:'Captura y validación',title:'Mapa AS-IS',sub:'Representar cómo funciona realmente hoy el proceso.',kind:'asis',coverage:'DF031–DF055'},
 {id:'PG05',group:'Captura y validación',title:'Fricciones y evidencia',sub:'Vincular problemas observables con los pasos donde ocurren y con su evidencia.',kind:'frictions',coverage:'DF056–DF065'},
 {id:'PG06',group:'Captura y validación',title:'Riesgo y controles',sub:'Evaluar sólo los riesgos activados por las condiciones del caso.',kind:'risk',coverage:'DF066–DF075'},
 {id:'PG07',group:'Captura y validación',title:'Impacto económico',sub:'Cuantificar mecanismos defendibles separando capacidad, caja, espera, pérdidas y herramientas.',kind:'economics',coverage:'DF076–DF085'},
 {id:'PG08',group:'Captura y validación',title:'Estado objetivo y restricciones',sub:'Definir qué debe conseguir el proceso futuro y qué límites debe respetar.',kind:'target',coverage:'DF086–DF092'},
 {id:'PG09',group:'Captura y validación',title:'Validación y cierre de captura',sub:'Confirmar el AS-IS, registrar gaps y acordar el siguiente paso.',kind:'review',coverage:'DF093–DF100'},
 {id:'PG10',group:'Diagnóstico y decisión',title:'Diagnóstico',sub:'Explicar qué está ocurriendo, dónde, por qué y con qué evidencia.',kind:'diagnosis',coverage:'Outputs server-owned'},
 {id:'PG11',group:'Diagnóstico y decisión',title:'Diseño TO-BE',sub:'Representar cómo funcionaría el proceso propuesto y qué cambia en cada paso.',kind:'tobe',coverage:'Outputs + target'},
 {id:'PG12',group:'Diagnóstico y decisión',title:'Comparación AS-IS / TO-BE',sub:'Hacer visible exactamente qué cambia y qué puede compararse.',kind:'compare',coverage:'Snapshots comparables'},
 {id:'PG13',group:'Diagnóstico y decisión',title:'Solución AUNEA System',sub:'Traducir la necesidad diagnosticada a una solución construible, no a un stack.',kind:'solution',coverage:'Recommendation / Product-Pricing'},
 {id:'PG14',group:'Diagnóstico y decisión',title:'Escenarios y business case',sub:'Comparar la recomendación óptima con alternativas gobernadas.',kind:'scenarios',coverage:'Scenario Comparator'},
 {id:'PG15',group:'Diagnóstico y decisión',title:'Resultado y entregables',sub:'Cerrar una síntesis ejecutiva coherente con el mismo snapshot.',kind:'result',coverage:'Snapshot final autorizado'}
];
const CAPTURE_FIELDS={
 context:[['Empresa / razón social','Seleccionar o confirmar empresa'],['Interlocutor principal','Seleccionar o confirmar contacto'],['Qué debe resolver esta sesión','Definir objetivo'],['Qué debe entregar el diagnóstico para resultar útil','Definir criterio de éxito'],['Restricciones conocidas','Añadir sólo si existen']],
 scope:[['Nombre del proceso','Proceso en lenguaje del cliente'],['Evento que inicia el proceso','Trigger observable'],['Resultado que marca el final correcto','Outcome observable'],['Responsable end-to-end','Seleccionar rol o contacto'],['Variantes materiales','Añadir sólo si cambian ruta, riesgo o economics']],
 baseline:[['Volumen habitual de casos','Valor + periodo'],['Volumen de pico','Sólo si aplica'],['SLA o tiempo objetivo','Sólo si existe'],['Tiempo end-to-end habitual','Dato declarado o medido'],['Backlog / cola','Sólo si aplica'],['Tendencia de volumen','Sin forecast automático']],
 target:[['Resultados deseados','Definir outcomes'],['Elementos que deben mantenerse','Controles, sistemas o prácticas'],['Qué no debe automatizarse o delegarse a IA','Límites explícitos'],['Plataforma / seguridad / acceso','Condicionantes, no solución'],['Adopción y cambio','Restricciones organizativas']]
};
// [AUNEA-FE-SIM-PAGES-030] END

// [AUNEA-FE-SIM-MODE-040] START — REVIEW renderer, navigation and Internal/Session mode
// PURPOSE: Exercise interface hierarchy, responsive behavior and mode filtering only.
// SOURCE: DEC-040/041/046/047; AUNEA_SYSTEM_SIMULATOR_CANONICAL v1.3.
// INPUTS: page/mode clicks.
// OUTPUTS: DOM state.
// SIDE_EFFECTS: none beyond DOM; no persistence or backend calls.
// CHANGE_RISK: HIGH.
let pageIndex=0, mode='internal', compareMode='compare';
const root=document.getElementById('root');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function navGroup(name){return `<div class="nav-group"><div class="nav-label">${name}</div>${PAGES.map((p,i)=>p.group===name?`<button class="nav-btn ${i===pageIndex?'active':''}" data-page="${i}"><span class="nav-num">${p.id}</span><span>${p.title}</span><span class="nav-state"></span></button>`:'').join('')}</div>`}
function shell(content){const p=PAGES[pageIndex];return `<div class="app"><aside class="rail"><div class="brand"><img src="../../../../6_MARCA_ACTIVOS/logo/isotipo_system.svg" alt="Isotipo AUNEA System"><div><strong>AUNEA SYSTEM</strong><span>Simulador · REVIEW</span></div></div>${navGroup('Captura y validación')}${navGroup('Diagnóstico y decisión')}<div class="internal-tools"><div class="nav-label">Herramientas internas</div><button class="nav-btn" disabled><span class="nav-num">INT01</span><span class="tool-text">Economía interna</span></button><button class="nav-btn" disabled><span class="nav-num">INT02</span><span class="tool-text">Plantillas</span></button></div></aside><main class="main"><header class="topbar"><div class="context"><strong>Empresa sin seleccionar · Proceso sin definir</strong><span>Prototipo REVIEW · sin conexión a datos ni engines</span></div><div class="top-actions"><div class="save-state internal-only">Sin cambios</div><div class="mode" aria-label="Vista"><button data-mode="internal" class="${mode==='internal'?'active':''}">Interno</button><button data-mode="session" class="${mode==='session'?'active':''}">Sesión</button></div></div></header><div class="workspace"><div class="page-head"><div><div class="eyebrow">${p.id} · ${p.group}</div><h1>${p.title}</h1><p>${p.sub}</p></div><div class="head-meta"><span class="chip system">${p.coverage}</span><span class="chip internal internal-only">REVIEW de interfaz</span></div></div>${content}</div></main></div><footer class="actionbar"><div class="left"><button class="btn quiet" data-prev ${pageIndex===0?'disabled':''}>Atrás</button><span class="progress-text">${p.id} de PG15</span></div><div class="right"><button class="btn secondary internal-only" disabled>Guardar</button><button class="btn" data-next ${pageIndex===PAGES.length-1?'disabled':''}>${pageIndex<8?'Continuar':pageIndex<14?'Siguiente':'Finalizado'}</button></div></footer>`}
function fields(kind){return `<div class="grid two">${(CAPTURE_FIELDS[kind]||[]).map((f,i)=>`<div class="card"><div class="field"><label>${esc(f[0])}${i===0?'<span class="chip system">Canónico</span>':''}</label><input class="control" placeholder="${esc(f[1])}" ${mode==='session'?'aria-label="Campo para validación durante sesión"':''}><small>El runtime consumirá control, opciones y requiredness del Diagnostic Master.</small></div></div>`).join('')}</div>`}
function canvas(label='AS-IS',withMarkers=false,tobe=false){const states=tobe?['Se mantiene','Se automatiza','Requiere decisión humana']:['Responsable · herramienta','Responsable · herramienta','Responsable · herramienta'];return `<div class="canvas-card"><div class="canvas-toolbar"><strong>${label}</strong><div class="toolbar-actions internal-only"><button class="btn secondary">Añadir paso</button><button class="btn quiet">Usar plantilla</button><button class="btn quiet">Reordenar</button></div></div><div class="canvas"><div class="flow-row">${[0,1,2].map((n,i)=>`${i?'<span class="connector"></span>':''}<button class="node ${i===1?'active':''}" data-node="${i}"><span class="num">PASO ${i+1}</span><strong>Paso ${i+1}</strong><small>${states[i]}</small>${withMarkers&&i===1?'<span class="marker">1</span>':''}</button>`).join('')}</div></div></div>`}
function inspector(title='Paso 2'){return `<aside class="inspector"><h3>${title}</h3><div class="meta">Elemento seleccionado</div><div class="detail-list"><div class="detail"><span>Responsable</span><b>Sin dato</b></div><div class="detail"><span>Herramienta</span><b>Sin dato</b></div><div class="detail"><span>Tiempo activo / espera</span><b>Sin dato / sin dato</b></div><div class="detail"><span>Decisión / excepción</span><b>No registrada</b></div></div><div class="internal-metadata internal-only">Metadata interna · Field_ID / provenance / branch / evidence / lifecycle se mostrarán aquí desde runtime.</div></aside>`}
function baseline(){return `<div class="kpis"><div class="kpi"><span>Volumen habitual</span><b>—</b><em>Sin dato</em></div><div class="kpi"><span>SLA / objetivo</span><b>—</b><em>No aplicable hasta capturar</em></div><div class="kpi"><span>Tiempo de ciclo</span><b>—</b><em>Separado de trabajo activo</em></div><div class="kpi"><span>Backlog</span><b>—</b><em>Sin dato</em></div></div><div style="height:16px"></div>${fields('baseline')}`}
function scope(){return `<div class="scope-flow"><div class="scope-node"><div class="eyebrow">Inicio</div><strong>Evento que inicia el proceso</strong><p>Sin definir</p></div><div class="arrow">→</div><div class="scope-node main"><div class="eyebrow">Proceso</div><strong>Nombre del proceso</strong><p>La frontera del análisis queda visible durante toda la sesión.</p></div><div class="arrow">→</div><div class="scope-node"><div class="eyebrow">Final</div><strong>Resultado correcto</strong><p>Sin definir</p></div></div><div style="height:16px"></div>${fields('scope')}`}
function frictions(){return `<div class="grid aside"><div>${canvas('Mapa AS-IS con fricciones',true)}<div style="height:16px"></div><div class="friction-list"><div class="finding"><span class="badge">1</span><div><strong>Posible fricción</strong><p>Candidato pendiente de confirmar. Se vincula al paso resaltado.</p></div><span class="evidence pending">Pendiente</span></div><div class="finding"><span class="badge">+</span><div><strong>Añadir fricción</strong><p>Desde catálogo/candidato/texto, sin crear Pain_ID desde cliente.</p></div><span class="evidence">Acción</span></div></div></div><aside class="inspector"><h3>Fricción seleccionada</h3><div class="meta">Descripción cliente</div><div class="detail-list"><div class="detail"><span>Causa / condición</span><b>Sin dato</b></div><div class="detail"><span>Pasos afectados</span><b>Paso 2</b></div><div class="detail"><span>Frecuencia / impacto</span><b>Sin dato</b></div><div class="detail"><span>Evidencia</span><b>Pendiente</b></div></div><div class="internal-metadata internal-only">Pain mapping, confidence y provenance quedan internos.</div></aside></div>`}
function risks(){return `<div class="grid aside"><div class="card"><div class="section-title"><strong>Riesgos aplicables</strong><span class="chip">Sólo branches activos</span></div><div class="risk-list"><div class="finding"><span class="badge">R</span><div><strong>Riesgo concreto</strong><p>Se vincula al proceso, acción o dato que lo activa.</p></div><span class="risk-tag">Pendiente de valorar</span></div><div class="status-line">Un branch no activado no se presenta como información faltante.</div></div></div><aside class="inspector"><h3>Riesgo seleccionado</h3><div class="detail-list"><div class="detail"><span>Probabilidad</span><b>Sin valorar</b></div><div class="detail"><span>Impacto</span><b>Sin valorar</b></div><div class="detail"><span>Control actual</span><b>Sin dato</b></div><div class="detail"><span>Supervisión humana</span><b>Según branch canónico</b></div></div></aside></div>`}
function economics(){return `<div class="guardrail"><strong>Regla de lectura:</strong> capacidad, ahorro de caja, espera, pérdidas directas y herramientas son conceptos separados.</div><div style="height:16px"></div><div class="grid two"><div class="card"><h3>Trabajo y capacidad</h3><p>Tiempo activo, retrabajo, seguimiento y reporting. Los derivados enlazan a su origen.</p></div><div class="card"><h3>Pérdidas directas</h3><p>Sólo cuando exista pérdida atribuible y evidencia suficiente.</p></div><div class="card"><h3>Herramientas / TCO</h3><p>Coste atribuible actual; no se presume ahorro futuro.</p></div><div class="card"><h3>Impacto en ingresos</h3><p>Sólo con relación causal defendible.</p></div></div><div style="height:16px"></div><div class="kpis"><div class="kpi"><span>Capacidad consumida</span><b>—</b><em>Sin dato</em></div><div class="kpi"><span>Ahorro de caja</span><b>—</b><em>No calculable aún</em></div><div class="kpi"><span>Pérdidas directas</span><b>—</b><em>Sin evidencia</em></div><div class="kpi"><span>Calidad de evidencia</span><b>—</b><em>Derivada por runtime</em></div></div>`}
function target(){return `<div class="triad"><div class="card"><div class="eyebrow">Objetivo</div><h3>Qué queremos conseguir</h3><p>Outcomes futuros, sin convertir tecnología en objetivo.</p></div><div class="card"><div class="eyebrow">Protección</div><h3>Qué debe mantenerse</h3><p>Controles, relaciones, sistemas o prácticas que no deben perderse.</p></div><div class="card"><div class="eyebrow">Límite</div><h3>Qué no debe automatizarse o delegarse a IA</h3><p>Human oversight y límites explícitos.</p></div></div><div style="height:16px"></div>${fields('target')}`}
function review(){return `<div class="grid aside"><div>${canvas('AS-IS para validación',true)}<div style="height:16px"></div><div class="card"><h3>Fricciones prioritarias</h3><p>Se seleccionan únicamente entre las fricciones ya creadas.</p></div></div><aside class="inspector review-panel"><h3>Cierre de captura</h3><div class="check-row"><span class="dot"></span><div><b>AS-IS</b><div class="meta">Listo para revisar</div></div><span class="chip">Revisar</span></div><div class="check-row"><span class="dot warn"></span><div><b>Información pendiente</b><div class="meta">Generada por sistema</div></div><span class="chip warn">Gap</span></div><div class="check-row"><span class="dot warn"></span><div><b>Evidencias a solicitar</b><div class="meta">Generadas por sistema</div></div><span class="chip warn">Pendiente</span></div><button class="btn" disabled>Confirmar AS-IS</button><div class="internal-metadata internal-only">Notas internas del consultor · DF100 · nunca visible en Sesión.</div></aside></div>`}
function diagnosis(){return `<div class="grid aside"><div>${canvas('Proceso con hotspots',true)}<div style="height:16px"></div><div class="friction-list"><div class="finding"><span class="badge">1</span><div><strong>Finding</strong><p>Qué ocurre, dónde y mecanismo causal. Sin output real hasta ejecutar backend.</p></div><span class="evidence pending">Evidencia pendiente</span></div></div></div><aside class="inspector"><h3>Por qué lo decimos</h3><div class="detail-list"><div class="detail"><span>Origen</span><b>Fricción / paso</b></div><div class="detail"><span>Impacto</span><b>No calculado</b></div><div class="detail"><span>Riesgo</span><b>No calculado</b></div></div><div class="internal-metadata internal-only">Pain_ID, mappings, confidence, engine/version, stale y warnings.</div></aside></div>`}
function tobe(){return `<div class="grid aside"><div>${canvas('Diseño TO-BE',false,true)}</div><aside class="inspector"><h3>Qué cambia</h3><div class="detail-list"><div class="detail"><span>Problema que resuelve</span><b>Output pendiente</b></div><div class="detail"><span>Responsable futuro</span><b>Sin definir</b></div><div class="detail"><span>Automatización / IA</span><b>Se representan por separado</b></div><div class="detail"><span>Supervisión humana</span><b>Según riesgo/constraint</b></div></div></aside></div>`}
function compare(){return `<div class="section-title"><div class="compare-switch"><button data-compare="asis" class="${compareMode==='asis'?'active':''}">Actual</button><button data-compare="tobe" class="${compareMode==='tobe'?'active':''}">Propuesto</button><button data-compare="compare" class="${compareMode==='compare'?'active':''}">Comparación</button></div><span class="chip">Sólo métricas comparables</span></div>${compareMode==='compare'?`<div class="compare-grid">${canvas('Actual')}${canvas('Propuesto',false,true)}</div><div style="height:16px"></div><div class="card"><table class="delta-table"><thead><tr><th>Dimensión</th><th>Actual</th><th>Propuesto</th></tr></thead><tbody><tr><td>Trabajo activo</td><td>—</td><td class="not-supported">No disponible con evidencia suficiente</td></tr><tr><td>Espera</td><td>—</td><td class="not-supported">No disponible</td></tr><tr><td>Capacidad liberada</td><td>—</td><td>—</td></tr><tr><td>Ahorro de caja</td><td>—</td><td>—</td></tr></tbody></table></div>`:canvas(compareMode==='asis'?'Actual':'Propuesto',false,compareMode==='tobe')}`}
function solution(){return `<div class="solution-hero"><div class="eyebrow">Solución recomendada</div><h2>Pendiente de output canónico</h2><p>La interfaz presentará primero el resultado/capability/system. El stack aparece después y sólo cuando ayude a entender la implementación.</p></div><div style="height:16px"></div><div class="grid three"><div class="card"><h3>Qué incluye</h3><p>Scope y capacidades procedentes de Recommendation / Solution Specification.</p></div><div class="card"><h3>Nivel funcional e IA</h3><p>Dos dimensiones separadas. Sin inferir más IA = mejor solución.</p></div><div class="card"><h3>Qué queda fuera</h3><p>Exclusiones y límites visibles antes de inversión.</p></div></div><div style="height:16px"></div><div class="card internal-only"><h3>Arquitectura técnica</h3><p>Segundo nivel de lectura: herramientas/componentes como soporte técnico, no como identidad comercial.</p></div>`}
function scenarios(){return `<div class="scenario-grid"><article class="scenario optimal"><div class="scenario-head"><span class="chip system">Óptimo</span><h3>Escenario recomendado</h3></div><div class="scenario-body">${scenarioRows()}</div></article><article class="scenario"><div class="scenario-head"><span class="chip">Alternativa</span><h3>Escenario A</h3></div><div class="scenario-body">${scenarioRows()}</div></article><article class="scenario"><div class="scenario-head"><span class="chip">Alternativa</span><h3>Escenario B</h3></div><div class="scenario-body">${scenarioRows()}</div></article></div><div style="height:16px"></div><div class="guardrail"><strong>Óptimo ≠ seleccionado:</strong> la decisión del cliente puede ser otra alternativa sin reescribir el escenario óptimo.</div>`}
function scenarioRows(){return ['Alcance','Nivel funcional','IA','Riesgo / control','Inversión / TCO','Capacidad liberada','Ahorro de caja','Payback'].map(x=>`<div class="scenario-row"><span>${x}</span><b>—</b></div>`).join('')}
function result(){const items=['Contexto y objetivo','AS-IS','Fricciones y diagnóstico','Riesgo e impacto económico','Estado objetivo','TO-BE','Solución AUNEA System','Escenario y decisión','Limitaciones','Siguiente paso'];return `<div class="grid aside"><div class="card"><div class="story">${items.map((x,i)=>`<div class="story-item"><span class="story-index">${String(i+1).padStart(2,'0')}</span><div class="story-content"><strong>${x}</strong><p>Se reconstruye desde el snapshot final autorizado. Sin datos de demostración inventados.</p></div></div>`).join('')}</div></div><aside class="inspector internal-only"><h3>Entregables</h3><div class="detail-list"><div class="detail"><span>Client View</span><b>No conectado en este prototipo</b></div><div class="detail"><span>Presentación</span><b>No conectado</b></div><div class="detail"><span>Informe</span><b>No conectado</b></div><div class="detail"><span>Propuesta</span><b>No conectado</b></div></div><button class="btn" disabled>Generar entregable</button></aside></div>`}
function contentFor(p){switch(p.kind){case'context':return fields('context');case'scope':return scope();case'baseline':return baseline();case'asis':return `<div class="grid aside"><div>${canvas('Mapa AS-IS')}</div>${inspector()}</div>`;case'frictions':return frictions();case'risk':return risks();case'economics':return economics();case'target':return target();case'review':return review();case'diagnosis':return diagnosis();case'tobe':return tobe();case'compare':return compare();case'solution':return solution();case'scenarios':return scenarios();case'result':return result();default:return''}}
function render(){document.body.classList.toggle('session',mode==='session');root.innerHTML=shell(contentFor(PAGES[pageIndex]));bind()}
function bind(){root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{pageIndex=Number(b.dataset.page);render()});root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});root.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>{if(pageIndex>0){pageIndex--;render()}});root.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{if(pageIndex<PAGES.length-1){pageIndex++;render()}});root.querySelectorAll('[data-compare]').forEach(b=>b.onclick=()=>{compareMode=b.dataset.compare;render()});root.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{root.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));b.classList.add('active')})}
render();
// [AUNEA-FE-SIM-MODE-040] END
</script>
</body>
</html>
