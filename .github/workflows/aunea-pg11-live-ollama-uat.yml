# [AUNEA-UAT-PG11-LIVE-WORKFLOW-297] START
# Real local Ollama inference on an isolated CI runner. Synthetic data ONLY.
# Does not use the user's workstation, customer data, connected accounts or secrets.
name: AUNEA PG11 Real Ollama Synthetic UAT

on:
  push:
    branches:
      - work/as-is-ux-simplification-20260930
    paths:
      - .github/workflows/aunea-pg11-live-ollama-uat.yml
      - 3_SYSTEM/backend/tests/pg11_live_ollama_gate.py
      - 3_SYSTEM/backend/aunea_backend/internal_ai_global.py
      - 3_SYSTEM/backend/aunea_backend/internal_ai_global_review.py
      - 3_SYSTEM/backend/aunea_backend/internal_ai_global_alternative.py
  workflow_dispatch:

jobs:
  real_local_model_synthetic_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      AUNEA_INTERNAL_AI_PROVIDER: ollama
      AUNEA_INTERNAL_AI_ENABLED: "1"
      AUNEA_INTERNAL_AI_DATA_AUTHORIZED: "1"
      AUNEA_OLLAMA_MODEL: aunea-qwen3-4b:latest
      AUNEA_OLLAMA_NUM_CTX: "8192"
      AUNEA_OLLAMA_TIMEOUT_SECONDS: "900"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "2m"
      AUNEA_PG11_UAT_REPORT: tests/pg11_live_ollama_report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic backend runtime
        run: python -m pip install -e '3_SYSTEM/backend[test]'
      - name: Start Ollama on CI loopback (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/aunea-pg11-ollama.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
      - name: Prepare the exact Qwen3 instruct base under the AUNEA local model alias
        shell: bash
        run: |
          set -euo pipefail
          ollama pull qwen3:4b-instruct
          printf 'FROM qwen3:4b-instruct\nPARAMETER num_ctx 8192\n' > /tmp/aunea-pg11-model
          ollama create aunea-qwen3-4b -f /tmp/aunea-pg11-model
          ollama list
      - name: Live Ollama inference across two processes and a human-approval conflict
        working-directory: 3_SYSTEM/backend
        run: python tests/pg11_live_ollama_gate.py
      - name: Upload synthetic-only report and local Ollama diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg11-block5-real-ollama-synthetic
          path: |
            3_SYSTEM/backend/tests/pg11_live_ollama_report.json
            /tmp/aunea-pg11-ollama.log
          if-no-files-found: warn
# [AUNEA-UAT-PG11-LIVE-WORKFLOW-297] END
