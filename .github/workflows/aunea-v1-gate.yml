# [AUNEA-UAT-GATE-010] START — AUNEA Internal V2 REVIEW acceptance gate
# PURPOSE: Run backend regression/canonical UAT and frontend modular/runtime UX tests on the same commit before any promotion decision.
# SOURCE: PROJECT_RULES.md; REQ-UAT-001/002/003; AUNEA Internal v2.0.0 REVIEW acceptance criteria.
# INPUTS: repository head.
# OUTPUTS: independent backend/frontend PASS/FAIL jobs in one gate.
# SIDE_EFFECTS: GitHub Actions only; no production data.
# CHANGE_RISK: CRITICAL.
name: AUNEA Internal V2 REVIEW Acceptance Gate

on:
  push:
    branches:
      - cleanup/v2.0.0-core
      - reconcile/frontend-v1.0.4-source
      - fix/session90-snapshot-invalidation-20260929
      - work/as-is-ux-simplification-20260930
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: python -m pip install -e '3_SYSTEM/backend[test]'
      - name: Backend regression and canonical UAT
        working-directory: 3_SYSTEM/backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3_SYSTEM/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 3_SYSTEM/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test runtime for PG11 cross-layer checks
        run: python -m pip install -e '../backend[test]'
      - name: Install frontend test runtime
        run: npm ci
      - name: Frontend modular runtime and UX regression
        run: npm test
  browser_uat:
    # Pin Playwright's native dependencies: ubuntu-latest advanced to an
    # unsupported rolling image and apt mirrors intermittently fail DNS.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 3_SYSTEM/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 3_SYSTEM/frontend/package-lock.json
      - name: Install locked browser test runtime
        run: npm ci
      - name: Install pinned Chromium browser
        # The GitHub Ubuntu 24.04 image has the native browser libraries.
        # Do not apt-install optional fonts: external Ubuntu mirrors are currently
        # failing DNS, blocking browser UAT before any test can execute.
        run: npx playwright install chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend runtime for PG11 browser rules
        run: python -m pip install -e '../backend[test]'
      - name: Start local backend for PG11 browser test
        working-directory: 3_SYSTEM/backend
        run: |
          python -m uvicorn aunea_backend.main:app --host 127.0.0.1 --port 8017 > /tmp/aunea-backend-pg11.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8017/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aunea-backend-pg11.log
          exit 1
      - name: Single end-to-end Chromium workflow and Impact canvas acceptance
        run: node tests/uat-browser-smoke.cjs
      - name: PG11 live-browser rules, preview and recovery on synthetic processes
        run: node tests/pg11-browser-journey.cjs
      - name: Preserve browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aunea-single-uat-chromium-evidence
          path: 3_SYSTEM/frontend/tests/browser-evidence/*.png
          if-no-files-found: ignore

# [AUNEA-UAT-GATE-010] END
