# [AUNEA-BUILD-CI-BACKEND-010] START — Backend CI
# PURPOSE: Run backend pytest suite on every push/PR touching 3_SYSTEM/backend.
# CHANGE_RISK: LOW.
name: AUNEA Backend Tests

on:
  push:
    paths:
      - '3_SYSTEM/backend/**'
      - '.github/workflows/aunea-backend-tests.yml'
  pull_request:
    paths:
      - '3_SYSTEM/backend/**'
      - '.github/workflows/aunea-backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3_SYSTEM/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[test]'
      - run: pytest -q
# [AUNEA-BUILD-CI-BACKEND-010] END
