# [AUNEA-BUILD-CI-BACKEND-010] START — Backend CI
# PURPOSE: Run backend pytest suite on every push/PR touching 3_SYSTEM/backend.
# CHANGE_RISK: LOW.
name: AUNEA Backend Tests

on:
  push:
    # The Acceptance Gate already runs this suite on the gated branches and on PRs to main.
    # Excluding them here keeps the fast path-filtered feedback everywhere else without
    # running the identical suite twice on the same commit.
    branches-ignore:
      - 'cleanup/v2.0.0-core'
      - 'reconcile/frontend-v1.0.4-source'
    paths:
      - '3_SYSTEM/backend/**'
      - '.github/workflows/aunea-backend-tests.yml'
  pull_request:
    branches-ignore:
      - 'main'
    paths:
      - '3_SYSTEM/backend/**'
      - '.github/workflows/aunea-backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3_SYSTEM/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[test]'
      - run: pytest -q
# [AUNEA-BUILD-CI-BACKEND-010] END
