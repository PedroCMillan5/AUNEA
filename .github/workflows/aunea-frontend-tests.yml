name: AUNEA Frontend Tests

on:
  push:
    paths:
      - '3_SYSTEM/frontend/**'
      - '.github/workflows/aunea-frontend-tests.yml'
  pull_request:
    paths:
      - '3_SYSTEM/frontend/**'
      - '.github/workflows/aunea-frontend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3_SYSTEM/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 3_SYSTEM/frontend/package-lock.json
      - run: npm ci
      - run: npm test
